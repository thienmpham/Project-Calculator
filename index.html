<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="calculator-container">
      <div class="screen-container">
        <div class="screen"></div>
      </div>

      <div class="calculator">
        <div class="btn-container">
          <button id="btn-l-par"><span>(</span></button>
          <button id="btn-r-par">)</button>
          <button id="btn-percent">%</button>
          <button id="btn-clear">CE</button>

          <button class="btn-num" id="btn-7">7</button>
          <button class="btn-num" id="btn-8">8</button>
          <button class="btn-num" id="btn-9">9</button>
          <button class="btn-num" id="btn-divide">÷</button>

          <button class="btn-num" id="btn-4">4</button>
          <button class="btn-num" id="btn-5">5</button>
          <button class="btn-num" id="btn-6">6</button>
          <button id="btn-multiply">×</button>

          <button class="btn-num" id="btn-1">1</button>
          <button class="btn-num" id="btn-2">2</button>
          <button class="btn-num" id="btn-3">3</button>
          <button id="btn-subtract">–</button>

          <button class="btn-num" id="btn-0">0</button>
          <button id="btn-dot">.</button>
          <button id="btn-equals">=</button>
          <button id="btn-add">+</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
